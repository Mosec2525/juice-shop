name: Semgrep SAST

on:
  push:

permissions:
  contents: read

jobs:
  semgrep-sast:
    name: Scan source code with Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep

      - name: Run Semgrep SAST and print results
        run: semgrep scan --config auto --text --verbose .
